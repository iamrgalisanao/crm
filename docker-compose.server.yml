# For a server that ALREADY has Nginx/Apache on 80/443 (multiple vhosts).
# No Caddy here — the stack binds to localhost only, and your existing web server
# reverse-proxies crm.abbadev.com to it (see deploy/nginx or deploy/apache).
#
#   docker compose -f docker-compose.server.yml --env-file .env.prod up -d --build
#   docker compose -f docker-compose.server.yml --env-file .env.prod exec api npm run db:seed

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: crm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    # Localhost only — reached by the host's Nginx/Apache, never the public net.
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: postgresql://crm:${POSTGRES_PASSWORD}@postgres:5432/crm?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      WEB_ORIGIN: ${PUBLIC_URL}
      SEED_ORG_NAME: ${SEED_ORG_NAME}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_BASE_CURRENCY: ${SEED_BASE_CURRENCY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_URL}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
