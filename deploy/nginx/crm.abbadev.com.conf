# Nginx vhost for the CRM, alongside your other abbadev.com sites.
# Put at /etc/nginx/sites-available/crm.abbadev.com and symlink into sites-enabled,
# OR /etc/nginx/conf.d/crm.abbadev.com.conf — then:
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d crm.abbadev.com     # adds SSL + the 443 block automatically
#
# Routes everything on one domain: /api/* → the NestJS API, everything else → Next.js.

server {
    listen 80;
    listen [::]:80;
    server_name crm.abbadev.com;

    client_max_body_size 15m;   # allow CSV imports / uploads

    # API (NestJS serves under the /api prefix). proxy_pass without a URI keeps
    # the original path, so /api/... reaches the API unchanged.
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Next.js app (+ websocket upgrade for HMR/dev; harmless in prod).
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
