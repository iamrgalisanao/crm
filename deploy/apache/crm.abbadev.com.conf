# Apache vhost for the CRM (alternative to the Nginx config).
# Requires: sudo a2enmod proxy proxy_http headers rewrite
# Put at /etc/apache2/sites-available/crm.abbadev.com.conf then:
#   sudo a2ensite crm.abbadev.com && sudo apache2ctl configtest && sudo systemctl reload apache2
#   sudo certbot --apache -d crm.abbadev.com     # adds SSL automatically

<VirtualHost *:80>
    ServerName crm.abbadev.com

    ProxyPreserveHost On
    ProxyRequests Off

    # API first (more specific), then the web app.
    ProxyPass        /api/  http://127.0.0.1:4000/api/
    ProxyPassReverse /api/  http://127.0.0.1:4000/api/

    ProxyPass        /      http://127.0.0.1:3000/
    ProxyPassReverse /      http://127.0.0.1:3000/

    RequestHeader set X-Forwarded-Proto "http"

    ErrorLog  ${APACHE_LOG_DIR}/crm_error.log
    CustomLog ${APACHE_LOG_DIR}/crm_access.log combined
</VirtualHost>
